# ============================================================================
# mise Polyglot Toolchain & Task Configuration
# Docs: https://mise.jdx.dev
# ============================================================================

[tools]
cmake = "3.28.6"
ninja = "1.12.1"
python = "3.12"
uv = "0.13.0"
ruff = "0.17.1"
gh = "2.103.0"

[env]
SONO_BUILD_DIR = "{{config_root}}/build"
SONO_CACHE_DIR = "{{config_root}}/.cache"
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"

# ----------------------------------------------------------------------------
# Environment & Dependency Management Tasks
# ----------------------------------------------------------------------------
[tasks."env:check"]
description = "Inspect local C++/Qt6/Python toolchain and asset readiness"
run = "python3 scripts/check_env.py"

[tasks."deps:sync"]
description = "Download and verify CEF/ORT SDKs and ONNX models for this host"
run = "python3 scripts/sync_deps.py"

[tasks."deps:lfs"]
description = "Pull on-demand Git LFS test media assets"
run = "git lfs pull --include='assets/media/**'"

[tasks.setup]
description = "One-command initialization for a fresh workspace"
depends = ["deps:sync", "deps:lfs"]
run = "python3 scripts/check_env.py"

# ----------------------------------------------------------------------------
# Build & Run Tasks (C++ / CMake / Ninja)
# ----------------------------------------------------------------------------
[tasks.configure]
description = "Configure CMake for the current host and generator"
depends = ["deps:sync"]
run = "python3 scripts/configure.py --type Release"

[tasks.build]
description = "Compile SonoWorkstation (Release)"
depends = ["configure"]
run = "cmake --build build --config Release -j"

[tasks."build:debug"]
description = "Configure and compile SonoWorkstation (Debug)"
depends = ["deps:sync"]
run = """
python3 scripts/configure.py --type Debug
cmake --build build --config Debug -j
"""

[tasks.run]
description = "Launch SonoWorkstation desktop application"
depends = ["build"]
run = "python3 scripts/run_app.py"

[tasks.clean]
description = "Remove CMake build directory"
run = "cmake -E remove_directory build"

# ----------------------------------------------------------------------------
# Quality Assurance, Testing & Formatting Tasks
# ----------------------------------------------------------------------------
[tasks."test:build"]
description = "Configure and build C++ test targets"
depends = ["deps:sync"]
run = """
python3 scripts/configure.py --type Release --tests
cmake --build build --config Release -j
"""

[tasks.test]
description = "Build and run Python and C++ test suites"
depends = ["test:build"]
run = "python3 scripts/run_tests.py"

[tasks.lint]
description = "Run Python static analysis and formatting checks"
run = """
ruff check scripts/ tests/python/
ruff format --check scripts/ tests/python/
"""

[tasks.format]
description = "Auto-format Python scripts and tests"
run = """
ruff check --fix scripts/ tests/python/
ruff format scripts/ tests/python/
"""
